name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_HEAD }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          install_args: aqua:gitleaks/gitleaks@8.30.1
          working_directory: ${{ runner.temp }}
          env: false
          export_path: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      - run: pnpm standards:repository
      - name: Record native tool versions
        run: |
          mkdir -p .security-review
          node --version >.security-review/primary-node.txt
          pnpm --version >.security-review/pnpm-version.txt
      - run: pnpm verify:application
      - name: Build source-derived documentation
        run: pnpm site:build
      - run: pnpm pack --pack-destination .security-review
      - name: Export the qualified source tree without private development history
        run: git archive --format=tar.gz --prefix=workspace-sync/ HEAD >.security-review/workspace-sync-source.tar.gz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Node 24 built-package smoke test
        run: node scripts/release.ts smoke
      - name: Scan the generated site and release archives without exposing matches
        run: node scripts/release.ts scan site/dist .security-review
      - name: Bind successful qualification to its exact source and archive
        run: node scripts/release.ts qualify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workspace-sync-${{ env.SOURCE_HEAD }}
          path: .security-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-sync-site-${{ env.SOURCE_HEAD }}
          path: site/dist/
          if-no-files-found: error
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          install_args: aqua:gitleaks/gitleaks@8.30.1
          working_directory: ${{ runner.temp }}
          env: false
          export_path: false
      - name: Scan complete source history without exposing matches
        run: node scripts/release.ts scan
